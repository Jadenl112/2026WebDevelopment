<!DOCTYPE html>
<!-- WD Lesson 1.2: How do we work with images on a web page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_images.asp
      https://www.w3schools.com/tags/tag_img.asp
-->

<html>
  <head>
    <title>Exploring Images</title>
  </head>
    <body>
 <!-- Example of an image from external source 
    <img src="https://www.pinclipart.com/picdir/middle/199-1994265_7-duke-java-clipart.png"> 
    -->

    <!-- Challenge 1: Create an <h1> and put "External Source Images" -->
    <h1>External Source Images</h1>

    <!-- Challenge 2: Add an image of your choice by searching Google and getting the image address. -->
    <img src="https://www.craftparts.com/cdn/shop/files/8919b7ef-bdfa-4699-a12c-176478d81ebf_SQ1000__60338.1745239302.386.513.jpg?v=1755014549">

    <!-- Challenge 3: Add three more of the same image. Change the width and height of each image to be 200x200 for the first, 150x150 for the second and 100x100 for the third -->
    <img src="https://www.craftparts.com/cdn/shop/files/8919b7ef-bdfa-4699-a12c-176478d81ebf_SQ1000__60338.1745239302.386.513.jpg?v=1755014549" width="200" height="200">
    <img src="https://www.craftparts.com/cdn/shop/files/8919b7ef-bdfa-4699-a12c-176478d81ebf_SQ1000__60338.1745239302.386.513.jpg?v=1755014549" width="150" height="150">
    <img src="https://www.craftparts.com/cdn/shop/files/8919b7ef-bdfa-4699-a12c-176478d81ebf_SQ1000__60338.1745239302.386.513.jpg?v=1755014549" width="100" height="100">

    <hr>

    <!-- Example of image from internal source, i.e your website 
    <img src="HulkLogo1.png"> 
    -->

    <!-- Challenge 4: Create an <h1> and put "Internal Source Images" -->
    <h1>Internal Source Images</h1>

    <!-- Challenge 5: Add the Hulk Logo 2 image located internally in the folder to the page -->
    <img src="HulkLogo2.jpg">

    <hr>

    <!-- Example of image from an internal source stored within folder of your website 
    <img src="images/HulkSmash1.png"> 
    -->

    <!-- Challenge 6: Create an <h1> and put "Internal Source Images Inside Folders" -->
    <h1>Internal Source Images Inside Folders</h1>

    <!-- Challenge 7: Add the Hulk Smash 2 and Hulk Smash 3 images. Both images are located in the images folder to the page -->
    <img src="images/HulkSmash2.png">
    <img src="images/HulkSmash3.jpg">

    <hr>

    <!-- Challenge Bonus: Create a heading with "Marvel Superheroes". Add a horizontal rule. Add five images of Marvel Superheroes. Make them all the same size -->
    <h2>Marvel Superheroes</h2>
    <hr>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyB9F4FOOGkZUCe0wOhSr5qskIYHp3VElpmRlqqSxkyA&s=10" width="250">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYsl9S-Vbt1KQ3JrV7LtobF7-reqz9VU61wK28NZDvGQ&s=10" width="250">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlUF7wPoqbRu5zpTyZPQ2o4l0IOwg6QAPJJsFJdkGQmg&s=10" width="250">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtlXGynmQj7N1grXS_w4NfMcEI6eI7aM3__nuV2w4xzQ&s=10" width="250">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWB7U0JEn7DS9r_Ikmce7qR4AILfcFpwieGdHTgq9D7Q&s=10" width="250">
    

  </body>
</html>
